name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 24.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Check committed Quality Profile and Prewarm Manifest hashes
        run: |
          if ! pnpm check:profile-hashes; then
            echo "::error title=Committed hash mismatch requires diagnosis::A mismatch from this check cannot distinguish between (1) a value that should have been re-minted but was not and (2) a value that was legitimately re-minted but whose committed anchor was not re-baked. Determine which case applies before changing any hash; do not update the committed anchor merely to make CI pass."
            exit 1
          fi
      - run: pnpm build
      - id: test
        run: pnpm test
      - name: Upload regression-acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-acceptance
          path: test-results/regression-acceptance/
          if-no-files-found: warn
          retention-days: 14
      - run: pnpm test:package
      - run: pnpm api:check
      - run: pnpm check:licenses
      - run: pnpm check:boundaries
