<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Basalt sea stack — reconstruction preview</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      body {
        margin: 0;
        background: #1b1c1e;
        color: #e6e6e8;
        display: flex;
        min-height: 100vh;
        align-items: flex-start;
        justify-content: center;
      }
      #stage {
        /* Fixed and square: the reference pack is 4096x4096, so a square canvas keeps the
           comparison sheet free of aspect-ratio artefacts. */
        width: 1024px;
        height: 1024px;
        flex: 0 0 auto;
      }
      canvas {
        display: block;
        width: 1024px;
        height: 1024px;
      }
      /* The panel lives in a DOM layer above the canvas and is hidden whenever the page is in
         capture mode, so it can never enter a comparison screenshot. */
      #panel-layer {
        position: fixed;
        top: 0;
        right: 0;
        z-index: 10;
        display: none;
      }
      #panel-layer[data-visible="true"] {
        display: block;
      }
      #enable {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 10;
        padding: 8px 14px;
        border: 1px solid #4a4c52;
        border-radius: 6px;
        background: #26282c;
        color: #e6e6e8;
        font-size: 13px;
        cursor: pointer;
      }
      #enable[hidden] {
        display: none;
      }
      #readout {
        position: fixed;
        left: 12px;
        top: 12px;
        z-index: 10;
        font-size: 12px;
        line-height: 1.5;
        background: rgba(20, 21, 23, 0.82);
        border: 1px solid #35373c;
        border-radius: 6px;
        padding: 8px 10px;
        max-width: 320px;
        white-space: pre-wrap;
      }
      #readout[hidden] {
        display: none;
      }
      /* Capture mode. Set by the page when the URL carries `capture=1`, which every comparison
         capture passes. Nothing outside the canvas may survive into a gate screenshot: a button
         in the corner is measured as part of the silhouette and moves the bounding box. */
      body[data-capture="1"] #panel-layer,
      body[data-capture="1"] #enable,
      body[data-capture="1"] #readout {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="panel-layer"></div>
    <button id="enable" type="button">
      Enable interaction and parameter panel
    </button>
    <div id="readout" hidden></div>
    <script
      type="module"
      src="/src/preview/basalt-sea-stack-preview.ts"
    ></script>
  </body>
</html>
